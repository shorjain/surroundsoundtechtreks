<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranging Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
<!--
  LAB  (/frontend/lab.html)

  Simulated phones, real pipeline. Chirp detection runs in this tab.
  Distances and the map are solved in Python on the local server.

  Two modes:
    Raw audio       simulate recordings → detectRound here → POST /api/finish
    Distances only  simulate noisy distances → POST /api/solve
-->

<h1>Ranging lab</h1>
<p class="muted">Simulated phones. Chirp detection runs here; the map is solved in Python on this server.</p>

<section>
  <div class="row">
    <div><label for="n">Phones</label><input id="n" type="number" min="3" max="10" value="6"></div>
    <div><label for="seed">Seed</label><input id="seed" type="number" value="81"></div>
  </div>
  <div class="row">
    <div><label for="mode">Mode</label>
      <select id="mode"><option value="audio">Raw audio</option><option value="dist">Distances only</option></select></div>
    <div><label for="band">Band (audio)</label>
      <select id="band"><option>2-6k</option><option>1-3k</option><option>6-10k</option><option>17-21k</option></select></div>
  </div>
  <div class="row">
    <div><label for="noise">Audio noise level</label><input id="noise" type="number" step="0.002" value="0.004"></div>
    <div><label for="dsig">Distance noise σ (m)</label><input id="dsig" type="number" step="0.005" value="0.02"></div>
  </div>
  <label><input id="wall" type="checkbox" checked style="width:auto"> Wall echo</label>
  <label><input id="shadow" type="checkbox" style="width:auto"> Break pair C–E (C hears an echo instead of E)</label>
  <button id="run">Run</button>
</section>

<section>
  <p class="big" id="headline"></p>
  <p class="muted" id="stats"></p>
  <svg class="map" id="map" role="img" aria-label="map of phone positions"></svg>
  <div id="warnings"></div>
  <h2>Pairs</h2>
  <div class="scroll"><table id="pairs"></table></div>
</section>

<script type="module">
import { randomLayout, simulateRecordings, simulateDistances } from '/backend/simulate.js';
import { detectRound } from '/backend/detectRound.js';
import { BANDS } from '/backend/signal/chirp.js';
import { api, drawMap, fmtM, esc } from '/frontend/common.js';

const $ = (id) => document.getElementById(id);
const ROOM = { width: 4, height: 3, wallY: 3.4 };   // metres; the echo wall sits just past the room edge

async function run() {
  const n = Number($('n').value);
  const seed = Number($('seed').value);
  const breakPair = $('shadow').checked && n >= 5;   // needs phones C and E to exist
  $('headline').textContent = 'Running…';
  $('warnings').innerHTML = '';

  // 1. Place phones randomly (≥ 40 cm apart). Names A, B, C, …
  const truthPos = randomLayout(n, { seed, width: ROOM.width, height: ROOM.height });
  const ids = truthPos.map((_, k) => String.fromCharCode(65 + k));

  // 2. Produce measurements and solve, in one of two ways.
  let layout, loops = null, distances;
  try {
    if ($('mode').value === 'audio') {
      // Detection stays in the page. Python turns the gaps into a map.
      const chirp = { ...BANDS[$('band').value], duration: 0.01 };
      const phones = ids.map((id, k) => ({ id, pos: truthPos[k], slot: k, selfDistance: 0.12 }));
      const { recordings } = simulateRecordings({
        phones, chirp, slotSeconds: 0.5, noise: Number($('noise').value), seed: seed + 1,
        wallY: $('wall').checked ? ROOM.wallY : null, wallReflection: 0.9,
        // "Break" = C barely hears E directly (−40 dB, e.g. facing away), so it locks onto the wall echo.
        shadow: breakPair ? [{ listener: 'C', source: 'E', gainDb: -40 }] : [],
      });
      const detected = detectRound({ phones, recordings, config: { chirp, slotSeconds: 0.5 } });
      const r = await api('POST', '/api/finish', {
        phones: detected.ids,
        gaps: detected.gaps,
        selfDistances: detected.selfDistances,
        bandwidthHz: detected.bandwidthHz,
        temperatureC: 20,
      });
      ({ layout, loops, distances } = r);
    } else {
      // Geometry only: true distances + Gaussian noise (+ a 50 cm "echo" on C–E if broken).
      const outliers = breakPair ? [{ a: 2, b: 4, extra: 0.5 }] : [];
      distances = simulateDistances(truthPos, { sigma: Number($('dsig').value), seed: seed + 1, outliers });
      layout = await api('POST', '/api/solve', { phones: ids, distances });
    }
  } catch (e) {
    $('headline').textContent = 'Could not solve';
    $('stats').textContent = '';
    $('map').innerHTML = '';
    $('pairs').innerHTML = '';
    $('warnings').innerHTML = `<p class="err">${esc(e.message)}. Start the server with node backend/server.js (Python with numpy is required).</p>`;
    return;
  }
  if (!layout) {
    $('headline').textContent = 'No map';
    $('stats').textContent = '';
    $('warnings').innerHTML = `<p class="err">${esc('The solver returned no layout.')}</p>`;
    return;
  }

  // 3. Compare with the truth. The solver's map has an arbitrary origin, rotation
  //    and mirror, so overlay the truth onto it first (Procrustes), then measure.
  const est = layout.phones.map((p) => [p.x, p.y]);
  const fit = await api('POST', '/api/procrustes', { estimate: truthPos, truth: est });
  const truth = Object.fromEntries(ids.map((id, k) => [id, fit.positions[k]]));

  // 4. Show it.
  drawMap($('map'), layout, { truth, ellipseZoom: 10 });
  const s = layout.stats;
  $('headline').textContent = `Position error (RMS): ${fmtM(fit.rmse)}`;
  $('stats').textContent =
    `χ² ${s.cost.toFixed(1)} vs limit ${Number.isFinite(s.chi2Threshold) ? s.chi2Threshold.toFixed(1) : '∞'} · ` +
    `spare measurements ${s.dof} · dropped ${layout.dropped.length ? layout.dropped.map((d) => `${d.a}–${d.b}`).join(', ') : 'none'}` +
    (loops ? ` · bad loops ${loops.badCount}/${loops.triangles.length}` : '');
  $('warnings').innerHTML = layout.warnings.map((w) => `<p class="err">⚠ ${esc(w)}</p>`).join('');

  // Pair table: measured vs true distance for every pair.
  const trueDist = (a, b) => {
    const [p, q] = [truthPos[ids.indexOf(a)], truthPos[ids.indexOf(b)]];
    return Math.hypot(p[0] - q[0], p[1] - q[1]);
  };
  const dropped = new Set(layout.dropped.map((d) => `${d.a}|${d.b}`));
  $('pairs').innerHTML = '<tr><th>Pair</th><th>True</th><th>Measured</th><th>Error</th><th>± 1σ</th><th></th></tr>' +
    distances.map((d) => {
      const isDropped = dropped.has(`${d.a}|${d.b}`);
      return `<tr><td>${d.a}–${d.b}</td><td>${fmtM(trueDist(d.a, d.b))}</td><td>${fmtM(d.d)}</td>` +
        `<td>${fmtM(d.d - trueDist(d.a, d.b))}</td><td>${fmtM(d.sigma)}</td>` +
        `<td>${isDropped ? '<span class="err">dropped</span>' : ''}</td></tr>`;
    }).join('');
}

$('run').addEventListener('click', run);
run();
</script>
</body>
</html>
