<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>phone-ranging tests</title>
  <style>
    body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 24px; background: #fff; color: #111; }
    .ok { color: #157f3b; } .bad { color: #b42318; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>phone-ranging signal tests</h2>
  <p>Map, ranging, and end-to-end tests run from <code>npm test</code> (they need Python).</p>
  <pre id="out">running…</pre>
  <script type="module">
    import { runAll } from './all.js';
    const out = document.getElementById('out');
    out.textContent = '';
    const result = await runAll((line, ok) => {
      const div = document.createElement('div');
      div.className = ok ? 'ok' : 'bad';
      div.textContent = line;
      out.appendChild(div);
    });
    window.__testResult = result;
  </script>
</body>
</html>
